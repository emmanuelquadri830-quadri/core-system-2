<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Home Screen Redesign</title>
<style>
  html, body { margin: 0; padding: 0; background: #fdf1f5; }
  body { font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: linear-gradient(180deg, #fff7fa 0%, #fdeef4 55%, #fbe1ea 100%); }

  /* soft colour blobs behind the phone */
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.55; }
  #blobA { width: 620px; height: 620px; left: -160px; top: 380px; background: #ffc2d6; }
  #blobB { width: 560px; height: 560px; right: -180px; top: 760px; background: #ffd9c7; }
  #blobC { width: 700px; height: 500px; left: 200px; top: 1450px; background: #ffb3cb; opacity: 0.45; }
  #grain { position: absolute; inset: 0; opacity: 0.06; mix-blend-mode: multiply; background: url(assets/grain.png); }

  /* titles */
  #titles { position: absolute; left: 0; top: 0; width: 1080px; height: 560px; text-align: center; }
  #chipWrap { position: absolute; left: 0; width: 1080px; top: 118px; height: 56px; }
  .chip { position: absolute; left: 50%; top: 0; height: 56px; transform: translateX(-50%); border-radius: 28px; padding: 0 26px; display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 700; letter-spacing: 3px; white-space: nowrap; }
  #chipBefore { background: #ffffff; color: #64748b; box-shadow: 0 6px 20px rgba(120, 40, 70, 0.10); }
  #chipLive { background: #17111a; color: #fff; box-shadow: 0 8px 26px rgba(23, 17, 26, 0.25); }
  #chipAfter { background: #fb3179; color: #fff; box-shadow: 0 8px 26px rgba(251, 49, 121, 0.35); }
  .chip .dot { width: 14px; height: 14px; border-radius: 50%; }
  #chipBefore .dot { background: #94a3b8; }
  #chipLive .dot { background: #ff3b30; box-shadow: 0 0 0 5px rgba(255, 59, 48, 0.25); }
  #chipAfter .dot { background: #fff; }
  #title { position: absolute; left: 0; width: 1080px; top: 206px; font-size: 92px; line-height: 100px; font-weight: 800; letter-spacing: -2.5px; color: #1b1220; font-family: 'Inter Display', Inter, sans-serif; }
  #title .pink { background: linear-gradient(90deg, #fb3179, #ff6aa2); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #sub { position: absolute; left: 0; width: 1080px; top: 428px; font-size: 32px; line-height: 40px; font-weight: 500; color: #7a6470; }
  #stepWrap { position: absolute; left: 0; width: 1080px; top: 196px; height: 64px; }
  .step { position: absolute; left: 50%; top: 0; height: 64px; transform: translateX(-50%); border-radius: 32px; padding: 0 30px 0 12px; display: flex; align-items: center; gap: 16px; background: rgba(23, 17, 26, 0.86); color: #fff; font-size: 28px; font-weight: 600; white-space: nowrap; box-shadow: 0 10px 30px rgba(23, 17, 26, 0.25); }
  .step b { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; background: #fb3179; font-size: 20px; font-weight: 800; letter-spacing: 0; }

  /* world: the phone, moved by the camera */
  #world { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
  #phone { position: absolute; left: 96.35px; top: 553px; width: 934px; height: 1962px; transform-origin: 0 0; }
  #phoneShadow { position: absolute; left: 40px; top: 80px; width: 854px; height: 1880px; border-radius: 150px; box-shadow: 0 70px 140px rgba(140, 20, 70, 0.28), 0 24px 48px rgba(40, 10, 25, 0.18); }
  #body { position: absolute; inset: 0; border-radius: 150px; background: linear-gradient(135deg, #4a4a50 0%, #1d1d21 18%, #2a2a2f 48%, #141417 70%, #3c3c42 100%); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.10), inset 0 0 0 5px rgba(0, 0, 0, 0.6); }
  #bezel { position: absolute; inset: 7px; border-radius: 143px; background: #050506; }
  .btn { position: absolute; width: 8px; border-radius: 4px; background: linear-gradient(90deg, #1a1a1d, #4b4b52 60%, #2a2a2e); }
  #screen { position: absolute; left: 27px; top: 27px; width: 880px; height: 1908px; border-radius: 123px; overflow: hidden; background: #fff; isolation: isolate; }
  #status { position: absolute; left: 0; top: 0; width: 880px; height: 120px; background: #fff; }
  #time { position: absolute; left: 92px; top: 46px; font-size: 38px; line-height: 40px; font-weight: 600; color: #0b0b0f; letter-spacing: -0.5px; }
  #island { position: absolute; left: 299px; top: 25px; width: 282px; height: 83px; border-radius: 42px; background: #000; z-index: 40; }
  #appHost { position: absolute; left: 0; top: 120px; width: 880px; height: 1788px; overflow: hidden; }
  #oldLayer { position: absolute; left: 0; top: 0; width: 880px; height: 1300px; z-index: 10; }
  #oldLayer img { position: absolute; left: 0; top: 0; width: 880px; height: 1300px; }
  #glass { position: absolute; inset: 0; border-radius: 123px; background: linear-gradient(115deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.0) 28%, rgba(255,255,255,0) 100%); pointer-events: none; z-index: 30; }
  #sweep { position: absolute; top: -200px; width: 260px; height: 2300px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.28), rgba(255,255,255,0)); transform: rotate(18deg); z-index: 31; opacity: 0; }

  /* overlay in video space */
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  #marquee { position: absolute; border: 2px solid #0d99ff; background: rgba(13, 153, 255, 0.10); opacity: 0; }
  .sel { position: absolute; border: 2.5px solid #0d99ff; opacity: 0; box-sizing: border-box; }
  .sel i { position: absolute; width: 14px; height: 14px; background: #fff; border: 2.5px solid #0d99ff; box-sizing: border-box; }
  .sel i:nth-child(1) { left: -8px; top: -8px; } .sel i:nth-child(2) { right: -8px; top: -8px; }
  .sel i:nth-child(3) { left: -8px; bottom: -8px; } .sel i:nth-child(4) { right: -8px; bottom: -8px; }
  .sel .tag { position: absolute; left: 50%; top: calc(100% + 12px); transform: translateX(-50%); background: #0d99ff; color: #fff; font-size: 25px; line-height: 25px; font-weight: 600; padding: 7px 12px; border-radius: 8px; white-space: nowrap; }
  #colorChip { position: absolute; display: flex; align-items: center; gap: 14px; padding: 12px 22px 12px 12px; background: #fff; border-radius: 18px; box-shadow: 0 12px 30px rgba(30, 10, 20, 0.22); font-size: 30px; font-weight: 600; color: #1b1220; opacity: 0; white-space: nowrap; }
  #colorChip .sw { width: 44px; height: 44px; border-radius: 10px; background: #e01b66; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08); }
  #ripple { position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 4px solid rgba(13, 153, 255, 0.85); opacity: 0; box-sizing: border-box; }
  #cursor { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  #cursor svg { position: absolute; overflow: visible; filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.35)); }
  #divider { position: absolute; width: 6px; margin-left: -3px; background: #fff; box-shadow: 0 0 18px rgba(0, 0, 0, 0.25); opacity: 0; }
  #dividerKnob { position: absolute; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; background: #fff; box-shadow: 0 10px 30px rgba(60, 10, 30, 0.30); display: flex; align-items: center; justify-content: center; opacity: 0; }
  .baLabel { position: absolute; height: 46px; line-height: 46px; padding: 0 20px; border-radius: 23px; font-size: 22px; font-weight: 800; letter-spacing: 2px; opacity: 0; white-space: nowrap; box-shadow: 0 8px 22px rgba(60, 10, 30, 0.22); }
  #keycap { position: absolute; left: 540px; top: 1690px; min-width: 120px; height: 84px; padding: 0 30px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 18px; background: linear-gradient(180deg, #2f2834, #17111a); color: #fff; font-size: 32px; font-weight: 600; letter-spacing: 0.5px; box-shadow: 0 7px 0 #07050a, 0 20px 40px rgba(20, 5, 15, 0.35), inset 0 1px 0 rgba(255,255,255,0.18); opacity: 0; white-space: nowrap; }
  #labBefore { background: rgba(23, 17, 26, 0.80); color: #fff; }
  #labAfter { background: #fff; color: #fb3179; }
  .caret { display: inline-block; width: 0; height: 1.02em; vertical-align: -0.17em; position: relative; }
  .caret::after { content: ''; position: absolute; left: 2px; top: 0; width: 3px; height: 100%; background: currentColor; border-radius: 1.5px; opacity: var(--cv, 0); }
  #fade { position: absolute; inset: 0; background: #fff7fa; opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div class="blob" id="blobA"></div><div class="blob" id="blobB"></div><div class="blob" id="blobC"></div>
  <div id="grain"></div>

  <div id="titles">
    <div id="chipWrap">
      <div class="chip" id="chipBefore"><span class="dot"></span>BEFORE</div>
      <div class="chip" id="chipLive"><span class="dot"></span>LIVE EDIT</div>
      <div class="chip" id="chipAfter"><span class="dot"></span>AFTER</div>
    </div>
    <div id="title">Home screen<br><span class="pink">redesign</span></div>
    <div id="sub">Cycle tracker app</div>
    <div id="stepWrap"></div>
  </div>

  <div id="world">
    <div id="phone">
      <div id="phoneShadow"></div>
      <div class="btn" style="left:-6px; top:300px; height:70px"></div>
      <div class="btn" style="left:-6px; top:430px; height:130px"></div>
      <div class="btn" style="left:-6px; top:590px; height:130px"></div>
      <div class="btn" style="right:-6px; top:470px; height:200px"></div>
      <div id="body"></div>
      <div id="bezel"></div>
      <div id="screen">
        <div id="status">
          <div id="time">9:41</div>
          <svg style="position:absolute; left:636px; top:50px" width="200" height="34" viewBox="0 0 200 34">
            <g fill="#0b0b0f">
              <rect x="0" y="22" width="7" height="10" rx="2"/><rect x="11" y="16" width="7" height="16" rx="2"/>
              <rect x="22" y="10" width="7" height="22" rx="2"/><rect x="33" y="3" width="7" height="29" rx="2"/>
            </g>
            <g transform="translate(60,3)" fill="#0b0b0f">
              <path d="M19 28.5 l-5.2 -5.6 a7.6 7.6 0 0 1 10.4 0 z"/>
              <path d="M5.6 15.6 a19.5 19.5 0 0 1 26.8 0 l-3.3 3.6 a14.6 14.6 0 0 0 -20.2 0 z"/>
              <path d="M-2 7.4 a30.5 30.5 0 0 1 42 0 l-3.3 3.6 a25.6 25.6 0 0 0 -35.4 0 z"/>
            </g>
            <g transform="translate(118,4)">
              <rect x="0.5" y="0.5" width="52" height="25" rx="7.5" fill="none" stroke="#0b0b0f" stroke-opacity="0.38" stroke-width="2"/>
              <rect x="4" y="4" width="40" height="18" rx="4.5" fill="#0b0b0f"/>
              <path d="M55 9 v8 a4 4 0 0 0 0 -8 z" fill="#0b0b0f" fill-opacity="0.4"/>
            </g>
          </svg>
        </div>
        <div id="appHost">
          <div id="oldLayer"><img src="assets/old3x.png"></div>
        </div>
        <div id="island"></div>
        <div id="glass"></div>
        <div id="sweep"></div>
      </div>
    </div>
  </div>

  <div id="overlay">
    <div id="marquee"></div>
    <div class="sel" id="sel"><i></i><i></i><i></i><i></i><div class="tag" id="selTag"></div></div>
    <div class="sel" id="sel2"><i></i><i></i><i></i><i></i></div>
    <div class="sel" id="sel3"><i></i><i></i><i></i><i></i></div>
    <div id="colorChip"><span class="sw" id="swatch"></span><span id="chipText">#E01B66</span></div>
    <div id="divider"></div>
    <div id="dividerKnob"><svg width="44" height="24" viewBox="0 0 44 24"><path d="M14 3 L4 12 L14 21 M30 3 L40 12 L30 21" fill="none" stroke="#fb3179" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="baLabel" id="labBefore">BEFORE</div>
    <div class="baLabel" id="labAfter">AFTER</div>
    <div id="keycap"><span id="keyText"></span></div>
    <div id="ripple"></div>
    <div id="cursor">
      <svg id="curArrow" width="40" height="56" viewBox="0 0 20 28" style="left:-3px; top:-2px">
        <path d="M1.5 1.5 L1.5 22.5 L6.6 17.6 L10.1 25.6 L13.6 24.1 L10.2 16.3 L17.2 16.3 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <svg id="curBeam" width="28" height="56" viewBox="0 0 14 28" style="left:-14px; top:-28px">
        <path d="M3 2 h3 q1 0 1 1.5 q0 -1.5 1 -1.5 h3 M7 3.5 v21 M3 26 h3 q1 0 1 -1.5 q0 1.5 1 1.5 h3" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <path d="M3 2 h3 q1 0 1 1.5 q0 -1.5 1 -1.5 h3 M7 3.5 v21 M3 26 h3 q1 0 1 -1.5 q0 1.5 1 1.5 h3" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <svg id="curCross" width="48" height="48" viewBox="0 0 24 24" style="left:-24px; top:-24px">
        <path d="M12 2 v20 M2 12 h20" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <path d="M12 2 v20 M2 12 h20" stroke="#111" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <svg id="curPen" width="52" height="52" viewBox="0 0 24 24" style="left:-3px; top:-3px">
        <path d="M2 2 L11.5 5 L19 12.5 L12.5 19 L5 11.5 Z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M19 12.5 L22.5 16 L16 22.5 L12.5 19" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M2.4 2.4 L8.6 8.6" stroke="#fff" stroke-width="1.1" stroke-linecap="round"/><circle cx="9.6" cy="9.6" r="1.75" fill="#fff"/>
      </svg>
    </div>
  </div>
  <div id="fade"></div>
</div>
<script src="app.js"></script>
<script src="timeline.js"></script>
</body>
</html>
